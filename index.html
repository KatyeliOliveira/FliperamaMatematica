<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fliperama da Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fliperama">
<style>
:root{
  color-scheme: light;
  --bg:#fff6e8; --ink:#3a2418; --soft:#7a5a45;
  --orange:#ff8a1f; --berry:#e2384f; --blue:#4a5fd8; --leaf:#3fa34d; --lemon:#ffd23f; --grape:#8a4bd1;
  --face:#ffffff; --line:#f1dcc0; --cream:#fff9f0; --accD:#c9620a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;padding-inline:16px;padding-block:16px 36px;overflow-x:hidden}
#bgfruits{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgfruits span{position:absolute;bottom:-60px;font-size:28px;opacity:.2;animation:float linear infinite}
@keyframes float{to{transform:translateY(-115vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px;width:100%}
header{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;row-gap:10px}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(26px,7.5vw,40px);line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance;flex:1;order:-1;text-shadow:0 2px 0 rgba(58,36,24,.06)}
h1 span{color:var(--orange)}
.icon-btn{border:2px solid var(--line);background:var(--face);border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none;box-shadow:0 2px 0 var(--line);transition:transform .12s,box-shadow .12s}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
@media (min-width:560px){h1{order:0}}
.sub{margin:0;color:var(--soft);font-size:15px;line-height:1.45}
h2.gt{font:800 26px "Baloo 2",sans-serif;margin:0}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* menu */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.menu{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.game{position:relative;overflow:hidden;border:0;border-radius:22px;padding:18px 14px 16px;cursor:pointer;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:136px;transition:transform .16s cubic-bezier(.3,1.4,.5,1),box-shadow .16s}
.game::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 58%);pointer-events:none}
.game::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -14px 18px -14px rgba(0,0,0,.18);pointer-events:none}
.game:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 8px 0 var(--gs),0 18px 26px -12px rgba(58,36,24,.4)!important}
.game:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 0 var(--gs),0 4px 8px -4px rgba(58,36,24,.3)!important}
.game .em{position:relative;display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;font-size:27px;background:rgba(255,255,255,.24);border-radius:15px;line-height:1}
.game b{position:relative;font:800 20px/1.12 "Baloo 2",sans-serif;letter-spacing:-.01em}
.game small{position:relative;font-weight:700;font-size:12.5px;opacity:.94;line-height:1.28}
.game .newtag{position:absolute;top:8px;right:8px;z-index:2;background:#fff;color:#c026d3;border-radius:999px;padding:3px 8px;font:800 10px/1 "Baloo 2",sans-serif;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip .e{font-size:27px;display:block;margin-bottom:1px}
.chip small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.tt{font:800 18px "Baloo 2",sans-serif;margin:4px 0 0;display:flex;align-items:center;gap:8px}
.tt::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--orange);flex:none}
/* menu hero */
.menuHero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:26px;padding:18px 20px;background:linear-gradient(135deg,var(--orange),var(--accD));color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.14),0 18px 30px -14px rgba(58,36,24,.5)}
.menuHero__glow{position:absolute;inset:-45%;background:radial-gradient(circle,rgba(255,255,255,.38),transparent 60%);animation:heroGlow 7s ease-in-out infinite;pointer-events:none}
@keyframes heroGlow{0%,100%{transform:scale(.9) translate(-8%,-6%)}50%{transform:scale(1.18) translate(6%,5%)}}
.menuHero__icon{position:relative;width:60px;height:60px;flex:none;background:rgba(255,255,255,.24);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45);animation:heroIconFloat 3.4s ease-in-out infinite}
@keyframes heroIconFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.menuHero__text{position:relative;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.menuHero__text b{font:800 22px "Baloo 2",sans-serif;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.menuHero__text span{font-weight:700;font-size:12.5px;opacity:.94}
.menuHero__swap{position:relative;flex:none;cursor:pointer;color:#fff;border:0;background:rgba(255,255,255,.24);border-radius:999px;padding:8px 14px;font:800 12.5px "Baloo 2",sans-serif;transition:transform .12s}
.menuHero__swap:active{transform:scale(.94)}
.statRow{display:flex;gap:10px;flex-wrap:wrap}
.statPill{display:flex;align-items:center;gap:7px;background:var(--face);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.statPill__ic{font-size:17px;line-height:1}
.statPill b{font:800 15px "Baloo 2",sans-serif}
.statPill small{color:var(--soft);font-weight:700;font-size:12px}
.statPill--star{border-color:#f5b301;box-shadow:0 3px 0 #f5b301}
.statPill--star b{color:#c98500}
/* shine sweep on game cards */
.game{isolation:isolate}
.game .shine{position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shineSweep 4.6s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes shineSweep{0%,58%{left:-60%}100%{left:135%}}
@media (prefers-reduced-motion:reduce){.game .shine{animation:none;display:none}.menuHero__icon,.menuHero__glow{animation:none}}
/* character chip flip */
.chip{position:relative;background:none;border:0;padding:0;cursor:pointer;perspective:700px;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.chipIn{position:relative;display:block;min-height:104px;border-radius:16px;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.chip:active .chipIn{transform:scale(.95) rotateY(var(--fy,0deg))}
.chip.on .chipIn{--fy:180deg;transform:rotateY(180deg)}
.chipFace{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;text-align:center}
.chipFace.cfFront{background:var(--face);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800}
.chipFace.cfBack{background:linear-gradient(160deg,var(--orange),var(--accD));color:#fff;transform:rotateY(180deg);font:700 11.5px/1.32 "Nunito",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.18)}
/* comum */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{background:var(--face);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.stat b{color:var(--berry)}
.btn{font:800 15px "Baloo 2",sans-serif;background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 3px 0 #2c7a37,0 7px 12px -5px rgba(44,122,55,.4);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2c7a37}
.btn.alt{background:var(--blue);box-shadow:0 3px 0 #2f3f9e,0 7px 12px -5px rgba(47,63,158,.4)}
.btn.alt:active{box-shadow:0 1px 0 #2f3f9e}
.btn.ghost{background:var(--face);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.back{background:none;border:0;color:var(--soft);font-weight:800;font-size:15px;cursor:pointer;padding:4px 0;align-self:flex-start}
.box{background:var(--face);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 14px -6px rgba(58,36,24,.1)}
.q{font:800 clamp(20px,5.6vw,25px)/1.2 "Baloo 2",sans-serif;margin:0;text-wrap:balance}
.opts{display:grid;gap:9px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{font:800 15px "Nunito",sans-serif;text-align:left;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--line);transition:transform .12s,box-shadow .12s}
.opt:hover:not(:disabled){border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 0 var(--orange)}
.opt.ok{background:#eefbe9;border-color:var(--leaf);box-shadow:0 2px 0 var(--leaf);animation:pop .35s}
.opt.no{background:#ffecee;border-color:var(--berry);box-shadow:0 2px 0 var(--berry);animation:shake .35s}
.opt:disabled{cursor:default}
.fb{margin:0;font-weight:800;min-height:1.3em}
.fb.ok{color:var(--leaf)}.fb.no{color:var(--berry)}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--face);border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:13px;color:var(--soft);margin:0}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bounceIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.enter{animation:bounceIn .4s both}
/* memória */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.g18{grid-template-columns:repeat(3,1fr)}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}.grid.g18{grid-template-columns:repeat(6,1fr)}}
.card{position:relative;aspect-ratio:3/4;max-width:100%;perspective:700px;border:0;padding:0;background:none;cursor:pointer;color:inherit}
.inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.card.done{animation:pop .4s .3s}
.card.miss .front{border-color:var(--berry)}
.side{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px}
.bk{background:var(--orange);box-shadow:0 4px 0 #c9620a;background-image:radial-gradient(circle,#ffb25e 0 6px,transparent 7px);background-size:24px 24px}
.bk::after{content:"?";font:800 32px "Baloo 2",sans-serif;color:#fff;text-shadow:0 2px 0 #c9620a}
.front{background:var(--face);border:3px solid var(--line);transform:rotateY(180deg);flex-direction:column;gap:2px}
.front .big{font-size:clamp(30px,9vw,44px);line-height:1.1}
.front .nm{font:800 clamp(15px,4.6vw,21px) "Baloo 2",sans-serif}
.front .tag{font:800 9px "Nunito",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.front .fr{font-weight:800;font-size:11.5px;color:var(--soft);line-height:1.15}
.card.done .front{border-color:var(--leaf);background:#eefbe9}
.win{background:var(--lemon);border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 0 #d8ab12;display:flex;flex-direction:column;gap:8px;align-items:center;animation:bounceIn .5s}
.win h3{font:800 26px "Baloo 2",sans-serif;margin:0}
.win p{margin:0;font-weight:700}
/* pistas */
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clues li{background:var(--cream);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-weight:700;animation:bounceIn .35s}
.clues li b{color:var(--blue);font:800 11px "Nunito";letter-spacing:.06em;text-transform:uppercase;display:block}
/* voz */
.speaker{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:14px;padding:12px}
.play{width:62px;height:62px;border-radius:50%;border:0;background:var(--grape);color:#fff;font-size:26px;cursor:pointer;flex:none;box-shadow:0 4px 0 #5f2f98}
.play.talk{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.line{font:800 18px/1.3 "Baloo 2",sans-serif;margin:0}
.line.hide{filter:blur(6px);user-select:none}
/* corrida */
.target{font-size:72px;text-align:center;line-height:1;animation:bounceIn .3s}
.timer{font:800 22px "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.timer.low{color:var(--berry);animation:pulse .5s infinite alternate}
/* v ou f */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{border:0;border-radius:16px;padding:18px;font:800 22px "Baloo 2",sans-serif;color:#fff;cursor:pointer}
.tf .v{background:var(--leaf);box-shadow:0 4px 0 #2c7a37}.tf .f{background:var(--berry);box-shadow:0 4px 0 #a82337}
.tf button:disabled{opacity:.5;cursor:default}
.g7{background:#0e9aa7;box-shadow:0 5px 0 #0a6f78}.g8{background:#d6479b;box-shadow:0 5px 0 #9c2e6f}
/* caça-palavras */
.ws{display:grid;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--line);border-radius:12px;padding:3px}
.ws button{aspect-ratio:1;border:0;background:var(--face);border-radius:5px;font:800 clamp(12px,3.6vw,18px) "Baloo 2",sans-serif;color:var(--ink);cursor:pointer;padding:0;min-width:0}
.ws button.sel{background:var(--lemon)}
.ws button.start{background:var(--orange);color:#fff}
.ws button.found{color:#fff}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--face);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px}
.words span.got{text-decoration:line-through;opacity:.55;border-color:var(--leaf)}
/* pintar */
.paintwrap{background:var(--face);border:2px solid var(--line);border-radius:18px;padding:8px}
.paintwrap svg{width:100%;height:auto;display:block;max-width:100%}
.paintwrap svg [data-p]{cursor:pointer;stroke:#3a2418;stroke-width:3;stroke-linejoin:round;transition:fill .2s}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid var(--face);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1)}

.stage{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px}
#cPaint{touch-action:none;cursor:crosshair;background:#fff}
#cLine{pointer-events:none}
.tools,.stamps{display:flex;flex-wrap:wrap;gap:6px}
.tools button,.stamps button{border:2px solid var(--line);background:var(--face);border-radius:12px;padding:7px 10px;font-weight:800;cursor:pointer;color:var(--ink)}
.stamps button{font-size:22px;padding:4px 8px}
.tools button[aria-pressed="true"],.stamps button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slider{display:flex;align-items:center;gap:10px;font-weight:800}
.slider input{flex:1;accent-color:var(--orange)}
.slider .dot{display:inline-block;border-radius:50%;border:2px solid var(--ink);flex:none}
.custom{display:flex;align-items:center;gap:10px;font-weight:800}
.custom input{width:52px;height:36px;border:0;background:none;padding:0;cursor:pointer}
.hang svg{width:100%;max-width:240px;display:block;margin:0 auto}
.word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.word .lt{width:32px;height:40px;border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font:800 24px "Baloo 2",sans-serif}
.word .sp{width:16px}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.keys button,.tiles button{border:2px solid var(--line);background:var(--cream);border-radius:10px;padding:8px 0;font:800 18px "Baloo 2",sans-serif;cursor:pointer;color:var(--ink)}
.keys button.ok{background:#eefbe9;border-color:var(--leaf)}.keys button.no{background:#ffecee;border-color:var(--berry);opacity:.6}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tiles button{width:46px;height:50px;font-size:22px;background:var(--lemon);border-color:#d8ab12;box-shadow:0 3px 0 #d8ab12}
.tiles button:disabled{opacity:.25;box-shadow:none}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad{aspect-ratio:1;border:0;border-radius:22px;background:var(--pc);opacity:.55;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:opacity .1s,transform .1s;color:#fff}
.pad span{font-size:40px}.pad small{font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 0 5px #fff,0 0 24px var(--pc)}
.arena{position:relative;width:100%;max-width:720px;margin:0 auto}
:fullscreen .arena,:-webkit-full-screen .arena{max-width:min(96vw,96vh*.7)}
.arena canvas{width:100%;height:auto;display:block;border-radius:18px;touch-action:none;border:2px solid var(--line)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,246,232,.85);border-radius:18px;text-align:center;padding:16px}

.ninja canvas{border:0}.ninja .overlay{background:rgba(40,20,8,.78)}
.xwrap{overflow-x:auto;padding-bottom:4px}.xgrid{display:grid;gap:2px;margin:0 auto}
.xc{position:relative;aspect-ratio:1;background:#fff;border:2px solid var(--ink);border-radius:4px}
.xc i{position:absolute;top:0;left:2px;font-size:9px;font-style:normal;font-weight:800;color:var(--soft);pointer-events:none}
.xc input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:800 17px "Baloo 2",sans-serif;text-transform:uppercase;color:var(--ink);padding:0;border-radius:3px}
.xc.hl{background:#fff4c2}.xc.good{background:#dff5d8}.xc.bad{background:#ffd9de}.xe{aspect-ratio:1}
.clueCols{display:grid;gap:12px}@media (min-width:560px){.clueCols{grid-template-columns:1fr 1fr}}
.clist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.clist li{background:var(--face);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}.len{color:var(--soft);font-size:12px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:480px;width:100%;margin:0 auto}
.ttt button{aspect-ratio:1;border:3px solid var(--line);background:var(--face);border-radius:18px;font-size:clamp(40px,14vw,64px);cursor:pointer;color:inherit}
.ttt button.wn{background:#eefbe9;border-color:var(--leaf);animation:pop .5s infinite alternate}.ttt button:disabled{cursor:default}
.mini{font-size:22px;border:2px solid var(--line);background:var(--face);border-radius:12px;padding:4px 8px;cursor:pointer}.mini[aria-pressed="true"]{border-color:var(--ink);background:var(--lemon)}
.chain{display:flex;flex-wrap:wrap;gap:4px;min-height:48px;align-items:center}
.dm{display:inline-flex;background:#fffdf8;border:2px solid var(--ink);border-radius:8px;overflow:hidden;vertical-align:middle}
.dm span{width:28px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px}
.dm span+span{border-left:2px solid var(--ink)}.dm.dbl{flex-direction:column}.dm.dbl span+span{border-left:0;border-top:2px solid var(--ink)}
.hand{display:flex;flex-wrap:wrap;gap:8px}.dbtn{border:0;background:none;padding:3px;border-radius:10px;cursor:pointer;opacity:.55}

.dancebtn:active{transform:scale(.92);background:var(--lemon)}
/* xadrez */
.chessboard{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;max-width:520px;width:100%;margin:0 auto;border:4px solid var(--ink);border-radius:8px;overflow:hidden}
.csq{border:0;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,10vw,48px);cursor:pointer;position:relative;padding:0}
.csq.light{background:#f0d9b5}.csq.dark{background:#b5885f}
.csq.sel{box-shadow:inset 0 0 0 4px var(--orange)}
.csq.lastmove{box-shadow:inset 0 0 0 100px rgba(255,210,63,.45)}
.csq.hint::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(58,36,24,.35)}
.csq.hintcap{box-shadow:inset 0 0 0 4px rgba(226,56,79,.8)}
/* xadrez 3D */
.c3d-cap{display:flex;flex-wrap:wrap;gap:2px 14px;font:700 13px/1.3 "Nunito",sans-serif;color:var(--soft);min-height:1.3em}
.c3d-cap i{font-style:normal;font-size:19px;line-height:1;margin-right:1px;color:var(--ink)}
.c3d-cap i.w{text-shadow:0 0 1px var(--ink)}
.c3d-cap em{font-style:normal;opacity:.7}
.c3d-stage{position:relative;width:100%;margin:0 auto;height:520px;border-radius:22px;overflow:hidden;border:3px solid var(--ink);background:radial-gradient(120% 90% at 50% 40%,#6d4a31 0%,#2b1a10 62%,#130a05 100%);background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--accD) 22%,#3a2416) 0%,#24160c 62%,#110904 100%);box-shadow:0 8px 0 rgba(0,0,0,.14),0 18px 30px -14px rgba(58,36,24,.55);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.arena .c3d-canvas{position:absolute;inset:0;display:block;border:0;border-radius:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none;-webkit-tap-highlight-color:transparent}
.c3d-load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:min(420px,60vh);border-radius:22px;background:radial-gradient(120% 90% at 50% 40%,#6d4a31,#2b1a10 70%);color:#fff;font:800 16px "Baloo 2",sans-serif;text-align:center}
.c3d-loadIc{font-size:64px;line-height:1;animation:c3dHop 1s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
@keyframes c3dHop{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(8deg)}}
.c3d-cam{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(20,10,4,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:2}
.c3d-cam:active{transform:scale(.92)}
.c3d-row{align-items:center;flex-wrap:nowrap;gap:8px}
.btn.c3d-sm{font-size:15px;padding:10px 14px;white-space:nowrap}
.btn.ghost.c3d-sm{padding:8px 12px}
.c3d-seg{margin-left:auto;flex-wrap:nowrap}
.c3d-seg button{padding:7px 12px;min-height:40px}
.c3d-end{border-radius:22px;z-index:3;padding:10px}
.gxOv.c3d-end .winFull{padding:12px 12px 12px;gap:6px}
.gxOv.c3d-end .winFull__medal{font-size:46px}
.gxOv.c3d-end .winFull__rate i{font-size:26px}.gxOv.c3d-end .winFull__rate i:nth-child(2){font-size:34px;margin-bottom:4px}
.gxOv.gxOv.c3d-end .win h3{font-size:22px}.gxOv.c3d-end .win p{font-size:13.5px}
.gxOv.c3d-end .winFull__earn{padding:5px 14px;font-size:17px}
.gxOv.c3d-end .winFull__btns{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gxOv.c3d-end .winFull__btns .btn{min-height:46px;padding:9px 8px;font-size:15px}
.gxOv.c3d-end .winFull__btns .btn:first-child:nth-last-child(3){grid-column:1/-1}
@media (prefers-reduced-motion:reduce){.c3d-loadIc{animation:none}}
/* dama */
.checker{width:88%;height:88%;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,.4),inset 0 -3px 4px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.25)}
.checker.w{background:radial-gradient(circle at 35% 30%,#fff,#e8c88c 70%);border:2px solid #8a5a2b}
.checker.b{background:radial-gradient(circle at 35% 30%,#5b5b5b,#161616 70%);border:2px solid #000}
.checker.king::after{content:"★";color:#ffd23f;font-size:75%;text-shadow:0 1px 1px rgba(0,0,0,.6)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
/* ===== camada compartilhada dos jogos ===== */
html{overflow-x:clip}
/* transição de tela (só opacidade + deslocamento vertical: não muda tamanhos medidos) */
#app.scrIn{animation:scrIn .34s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes scrIn{from{opacity:0;transform:translateY(16px)}}
/* modo jogo: topo mais enxuto, o cabeçalho do jogo assume */
body.inGame h1{display:none}
body.inGame header{justify-content:flex-end}
body.inGame header #themeBtn{margin-right:auto}
body.inGame .profileBar{display:none}
/* cabeçalho do jogo */
.gameHdr{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:10px;border-radius:24px;padding:10px 12px 10px 10px;margin:0 0 16px;background:linear-gradient(135deg,var(--orange),var(--accD));color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.14),0 16px 26px -14px rgba(58,36,24,.55)}
.gameHdr__glow{position:absolute;inset:-60%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%);animation:heroGlow 7s ease-in-out infinite;pointer-events:none;z-index:-1}
.gameHdr::after{content:"";position:absolute;top:0;left:-60%;width:30%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:shineSweep 6s ease-in-out 1s infinite;pointer-events:none;z-index:-1}
.gameHdr__back{position:relative;flex:none;width:50px;height:50px;border:0;border-radius:17px;background:#fff;color:var(--accD);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .12s cubic-bezier(.3,1.4,.5,1),box-shadow .12s;-webkit-tap-highlight-color:transparent}
.gameHdr__back svg{width:26px;height:26px;display:block}
.gameHdr__back:hover{transform:translateY(-2px)}
.gameHdr__back:active{transform:translateY(3px) scale(.92);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.gameHdr__back:focus-visible{outline:3px solid #fff;outline-offset:2px}
.gameHdr__ic{position:relative;flex:none;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-size:27px;line-height:1;box-shadow:inset 0 2px 0 rgba(255,255,255,.45);animation:heroIconFloat 3.4s ease-in-out infinite}
h2.gameHdr__title{position:relative;flex:1;min-width:0;margin:0;font:800 clamp(19px,5.6vw,25px)/1.08 "Baloo 2",sans-serif;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2),0 0 14px rgba(0,0,0,.12);overflow-wrap:anywhere;text-wrap:balance}
.gameHdr--long h2.gameHdr__title{font-size:clamp(17px,4.8vw,21px)}
.gameHdr__stars{position:relative;flex:none;display:flex;align-items:center;gap:4px;background:#fff;color:#a86b00;border-radius:999px;padding:6px 12px 6px 9px;font:800 16px "Baloo 2",sans-serif;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.gameHdr__stars span{font-size:17px;line-height:1}
.gameHdr__stars.bump{animation:hdrBump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes hdrBump{0%{transform:scale(1)}30%{transform:scale(1.28) rotate(-6deg)}60%{transform:scale(.94) rotate(3deg)}100%{transform:scale(1)}}
/* componentes comuns, estilo brinquedo */
.box{border:3px solid var(--line);border-radius:22px;padding:18px;gap:14px;box-shadow:0 6px 0 var(--line),0 16px 26px -16px rgba(58,36,24,.3)}
.box.show{box-shadow:0 6px 0 #0e2140,0 16px 26px -14px rgba(14,33,64,.6)}
.q{font:800 clamp(21px,5.9vw,27px)/1.18 "Baloo 2",sans-serif}
.bar{gap:7px}
.stat{border:2px solid var(--line);padding:6px 11px;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 var(--line)}
.box:has(> .win:only-child){background:none;border:0;box-shadow:none;padding:0}
.stat b{color:var(--accD);font-family:"Baloo 2",sans-serif;font-size:16px}
.progress{height:14px;border-radius:99px;background:var(--line);box-shadow:inset 0 2px 3px rgba(0,0,0,.08);overflow:hidden}
.progress i{border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--lemon));position:relative;transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.progress i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 8px,transparent 8px 16px);background-size:22.6px 22.6px;animation:barStripes 1s linear infinite}
@keyframes barStripes{to{background-position:22.6px 0}}
.tt{font-size:19px}
.tt::before{height:20px;width:6px;background:linear-gradient(var(--orange),var(--accD))}
.seg button{border-width:2px;padding:8px 14px;font-size:14px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.seg button:active{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 var(--line)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--orange),var(--accD));border-color:var(--accD);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn{position:relative;font-size:16px;padding:12px 22px;box-shadow:0 4px 0 #2c7a37,0 9px 14px -6px rgba(44,122,55,.45);transition:transform .14s cubic-bezier(.3,1.4,.5,1),box-shadow .14s,filter .14s;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn:not(.ghost){background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%)}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #2c7a37}
.btn.alt{box-shadow:0 4px 0 #2f3f9e,0 9px 14px -6px rgba(47,63,158,.45)}
.btn.alt:active{box-shadow:0 1px 0 #2f3f9e}
.btn.ghost{border-width:3px;box-shadow:0 4px 0 var(--line);text-shadow:none}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn:disabled{filter:grayscale(.5);opacity:.6;cursor:default;transform:none}
.pname{border-width:3px;border-radius:16px;font-size:18px;box-shadow:inset 0 2px 0 rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s}
.pname:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 22%,transparent)}
.xc input:focus{outline:0;background:#fff4c2}
.slider input,.custom input{accent-color:var(--orange)}
/* respostas: certo / errado */
.opt{position:relative;font-size:16px;line-height:1.25;background:var(--face);border:3px solid var(--line);border-radius:16px;padding:13px 14px;min-height:56px;box-shadow:0 4px 0 var(--line);transition:transform .14s cubic-bezier(.3,1.4,.5,1),box-shadow .14s,background-color .2s,opacity .25s;-webkit-tap-highlight-color:transparent}
.opt:hover:not(:disabled){box-shadow:0 6px 0 var(--orange)}
.opt:active:not(:disabled){transform:translateY(3px) scale(.96);box-shadow:0 1px 0 var(--orange)}
.opt.ok,.opt.no{color:#fff;padding-right:46px;opacity:1}
.opt.ok{background:linear-gradient(180deg,#5ed36f,#2fa446);border-color:#238a37;box-shadow:0 4px 0 #1d7530,0 0 0 5px rgba(63,190,85,.28);animation:optOk .6s cubic-bezier(.3,1.6,.5,1)}
.opt.no{background:linear-gradient(180deg,#ff6b7f,#e2384f);border-color:#b3223a;box-shadow:0 4px 0 #8f1a2e;animation:optNo .45s ease}
.opt.ok::after,.opt.no::after{position:absolute;right:10px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:#fff;font:900 17px/28px system-ui,sans-serif;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.18);animation:badgePop .45s .08s cubic-bezier(.3,1.9,.5,1) backwards}
.opt.ok::after{content:"✓";color:#238a37}
.opt.no::after{content:"✕";color:#c42640}
.opt.ok::before{content:"";position:absolute;inset:-3px;border-radius:18px;border:3px solid #8be89a;animation:ringOut .7s ease-out forwards;pointer-events:none}
.opts .opt:disabled:not(.ok):not(.no){opacity:.45;transform:scale(.97);box-shadow:0 2px 0 var(--line)}
.show .opt.ok{background:linear-gradient(180deg,#5ed36f,#2fa446)}.show .opt.no{background:linear-gradient(180deg,#ff6b7f,#e2384f)}
@keyframes optOk{0%{transform:scale(1)}35%{transform:scale(1.09) translateY(-4px)}60%{transform:scale(.97)}80%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes optNo{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px) rotate(-1.5deg)}30%{transform:translateX(8px) rotate(1.5deg)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-2px)}}
@keyframes badgePop{from{transform:scale(0) rotate(-90deg)}}
@keyframes ringOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.12,1.5)}}
.fb{font-size:17px;min-height:1.4em}
.fb.ok,.fb.no{animation:fbIn .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(6px) scale(.9)}}
.tf button{transition:transform .14s cubic-bezier(.3,1.4,.5,1),box-shadow .14s,opacity .25s;background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);font-size:24px;padding:20px 12px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.tf button:active:not(:disabled){transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.tf button{position:relative}
.tf button.ok,.tf button.no{opacity:1}
.tf button.ok::after,.tf button.no::after{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#fff;font:900 16px/26px system-ui,sans-serif;text-align:center;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.18);animation:badgePop .45s .08s cubic-bezier(.3,1.9,.5,1) backwards}
.tf button.ok::after{content:"✓";color:#238a37}
.tf button.no::after{content:"✕";color:#c42640}
.tf button.no{filter:saturate(.55) brightness(.92)}
.tf button.ok{animation:optOk .6s cubic-bezier(.3,1.6,.5,1);box-shadow:0 4px 0 #2c7a37,0 0 0 5px rgba(63,190,85,.35)}
.tf button.no{animation:optNo .45s ease;box-shadow:0 4px 0 #a82337,0 0 0 5px rgba(226,56,79,.3)}
.keys button{transition:transform .12s}
.keys button:active:not(:disabled){transform:scale(.9)}
.keys button.ok{animation:optOk .5s cubic-bezier(.3,1.6,.5,1)}
.keys button.no{animation:optNo .4s ease}
/* faísca de acerto (criada via JS, some sozinha) */
.sparkBurst{position:fixed;width:0;height:0;pointer-events:none;z-index:61}
.sparkBurst i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;font-style:normal;font-size:15px;line-height:12px;text-align:center;animation:sparkFly .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(200deg);opacity:0}}
/* tela de vitória (.win antiga já ganha o visual novo) */
.win{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(165deg,#fff6c4,#ffd84d 55%,#ffb627);border:3px solid #fff;border-radius:26px;padding:84px 18px 22px;text-align:center;color:#4a2c00;box-shadow:0 8px 0 #d99400,0 22px 34px -14px rgba(170,100,0,.55);display:flex;flex-direction:column;gap:10px;align-items:center;animation:winIn .7s cubic-bezier(.3,1.5,.5,1) both}
.win::before{content:"🏆";position:absolute;left:0;right:0;top:12px;font-size:58px;line-height:1;text-align:center;animation:trophyBob 2.6s ease-in-out .7s infinite;filter:drop-shadow(0 5px 0 rgba(150,90,0,.25))}
.win::after{content:"";position:absolute;left:50%;top:46px;width:600px;height:600px;margin:-300px 0 0 -300px;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 9deg,rgba(255,255,255,0) 9deg 22.5deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 60%);mask:radial-gradient(circle,#000 8%,transparent 60%);animation:raysSpin 16s linear infinite;z-index:-1;pointer-events:none}
.win h3{font:800 clamp(27px,8vw,36px)/1.05 "Baloo 2",sans-serif;margin:0;color:#5a3000;text-shadow:0 2px 0 rgba(255,255,255,.7);text-wrap:balance}
.win p{margin:0;font-weight:800;font-size:16px;line-height:1.35;color:#6b4a10;text-wrap:balance}
.win .btn{margin-top:4px}
.show .win{color:#4a2c00}
@keyframes winIn{0%{opacity:0;transform:scale(.55) translateY(24px)}60%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes trophyBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
@keyframes raysSpin{to{transform:rotate(360deg)}}
/* resultado completo (winPanel) */
.win.winFull{padding:22px 18px 20px;gap:12px}
.win.winFull::before{content:none}
.winFull__medal{font-size:72px;line-height:1;animation:medalIn .8s cubic-bezier(.3,1.7,.5,1) .15s backwards,trophyBob 2.6s ease-in-out 1s infinite;filter:drop-shadow(0 6px 0 rgba(150,90,0,.25))}
@keyframes medalIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.winFull__rate{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-top:-4px}
.winFull__rate i{font-style:normal;font-size:40px;line-height:1;animation:rateIn .5s cubic-bezier(.3,1.9,.5,1) backwards}
.winFull__rate i:nth-child(2){font-size:52px;margin-bottom:8px}
.winFull__rate i.off{filter:grayscale(1) brightness(1.4);opacity:.42}
@keyframes rateIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
.winFull__earn{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 18px;font:800 20px "Baloo 2",sans-serif;color:#a86b00;box-shadow:0 4px 0 rgba(170,100,0,.35);animation:fbIn .5s .9s cubic-bezier(.3,1.6,.5,1) backwards}
.winFull__earn b{font-variant-numeric:tabular-nums;min-width:1.2em}
.winFull__rec{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#8a4bd1,#e2508f);color:#fff;border-radius:999px;padding:7px 16px;font:800 16px "Baloo 2",sans-serif;box-shadow:0 4px 0 rgba(90,30,120,.4);animation:recIn .6s 1.2s cubic-bezier(.3,1.8,.5,1) backwards,recGlow 1.6s ease-in-out 1.8s infinite}
@keyframes recIn{from{transform:scale(0) rotate(-10deg);opacity:0}}
@keyframes recGlow{50%{box-shadow:0 4px 0 rgba(90,30,120,.4),0 0 0 6px rgba(226,80,143,.25)}}
.winFull__btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:400px;margin-top:4px}
.winFull__btns .btn{margin:0;padding:13px 10px;min-height:54px;line-height:1.1}
.winFull__btns .btn:only-child{grid-column:1/-1}
/* +N estrelas flutuando */
.starToast{top:auto;bottom:96px;background:linear-gradient(180deg,#fffbe8,#fff0b8);border:3px solid #fff;color:#a86b00;font-size:24px;padding:10px 24px 10px 20px;box-shadow:0 6px 0 #e0a100,0 14px 22px -8px rgba(160,100,0,.5)}
.starToast::before,.starToast::after{content:"✨";position:absolute;font-size:18px;animation:toastSpark 1.6s ease forwards}
.starToast::before{left:-14px;top:-12px}
.starToast::after{right:-14px;bottom:-10px;animation-delay:.15s}
@keyframes toastSpark{0%,10%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1.2) rotate(90deg)}100%{opacity:0;transform:scale(.6) rotate(200deg)}}
.fxToast{position:fixed;left:50%;top:14px;z-index:70;max-width:min(92vw,420px);display:flex;align-items:center;gap:10px;padding:10px 20px 10px 14px;border-radius:999px;background:linear-gradient(135deg,#8a4bd1,#e2508f);color:#fff;border:3px solid #fff;font:800 18px/1.15 "Baloo 2",sans-serif;box-shadow:0 5px 0 rgba(90,30,120,.45),0 16px 26px -10px rgba(90,30,120,.55);pointer-events:none;animation:fxToastIn 2.8s cubic-bezier(.3,1.5,.5,1) forwards;transform:translateX(-50%)}

/* 4 opções numéricas distintas perto da resposta certa (texto) */
function mathOpts(c,near=[]){
  const set=new Set([String(c)]);
  [...near,c+1,c-1,c+10,c-10,c+2,c-2,c+5,c-5].forEach(x=>{if(set.size<4&&x>=0&&!set.has(String(x)))set.add(String(x))});
  let g=0;while(set.size<4&&g++<40)set.add(String(c+mrnd(3,20)));

function mkNums(count){

    const n=mrnd(11,98);if(used.has(n))continue;used.add(n);

    clues.push(n%2===0?'Sou um número par.':'Sou um número ímpar.');preds.push(x=>x%2===n%2);
    if(divs.length){const d=divs[mrnd(0,divs.length-1)];clues.push(`Sou múltiplo de ${d}.`);preds.push(x=>x%d===0);}
    else{const sm=x=>String(x).split('').reduce((a,d)=>a+ +d,0),s=sm(n);clues.push(`A soma dos meus algarismos é ${s}.`);preds.push(x=>sm(x)===s);}

    const u=n%10;clues.push(`O meu algarismo das unidades é ${u}.`);preds.push(x=>x%10===u);
    const near=[];
    for(let k=1;k<=40&&near.length<7;k++)for(const x of shuffle([n-k,n+k])){if(near.length<7&&x>=10&&x<=99&&!near.includes(x)&&preds.some(p=>!p(x)))near.push(x);}

  }

}

function tone(f,d=.12,type='sine',vol=.18,when=0,slide=0){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+when;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);

  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);
}

const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function confetti(){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ff8a1f','#e2384f','#4a5fd8','#3fa34d','#ffd23f','#8a4bd1'];
  const ems=['⭐','✨','💖'];
  for(let i=0;i<140;i++){
    const em=Math.random()<.16?ems[i%3]:null;
    parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:em?16+Math.random()*10:5+Math.random()*6,c:cols[i%6],r:Math.random()*6,vr:(Math.random()-.5)*.3,em});
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.em){cx.font=p.s+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.em,0,0)}
    else{cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6)}
    cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+30);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null);
}

function gxScale(cv,W,H,mx){const S=Math.min(mx||2,Math.max(1,window.devicePixelRatio||1));cv.width=Math.round(W*S);cv.height=Math.round(H*S);return S}

function gxPool(n){const a=Array.from({length:n},()=>({on:false}));let k=0;
  return{spawn(o){let i=a.findIndex(x=>!x.on);if(i<0)i=k++%n;a[i]=Object.assign({on:true},o);return a[i]},
    each(f){for(let i=0;i<n;i++)if(a[i].on)f(a[i])},clear(){for(let i=0;i<n;i++)a[i]={on:false}}}}
function gxText(g,t,x,y,size,fill,stroke,lw){g.font=`800 ${size}px "Baloo 2",system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=lw||Math.max(3,size*.2);g.strokeStyle=stroke||'rgba(20,8,40,.75)';g.strokeText(t,x,y);g.fillStyle=fill||'#fff';g.fillText(t,x,y)}
/* clareia (p>0) ou escurece (p<0) uma cor #rrggbb */
function gxShade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);return`rgb(${Math.round(r+(t-r)*a)},${Math.round(gg+(t-gg)*a)},${Math.round(b+(t-b)*a)})`}
function gxRgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
/* tremidinha do elemento (termina sozinha) */
function gxShake(el,amp,ms){if(!el||!el.animate||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const a=amp||4;
  el.animate([{transform:'translate(0,0)'},{transform:`translate(${-a}px,${a*.6}px)`},{transform:`translate(${a}px,${-a*.6}px)`},{transform:`translate(${-a*.6}px,${-a*.4}px)`},{transform:`translate(${a*.3}px,0)`},{transform:'translate(0,0)'}],{duration:ms||260,easing:'ease-out'})}

  build();
}

.it-card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--tc)}
.it-card:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 var(--line)}
.it-card:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

.it-lb.big{font-size:30px;line-height:1.05;padding:0 4px}.it-lb.big.md{font-size:20px}
.it-card.dim{opacity:.4;filter:grayscale(.6);transform:scale(.95);box-shadow:none}
.it-card.right{border-color:#2c9b46;background:linear-gradient(160deg,#f2fff0,#d8f6d0);box-shadow:0 5px 0 #2c9b46,0 0 0 5px rgba(63,163,77,.25);animation:it-win .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes it-win{0%{transform:scale(1)}40%{transform:scale(1.09) rotate(-2deg)}100%{transform:scale(1)}}
.it-card.wrong{border-color:var(--berry);background:#ffecee;box-shadow:0 5px 0 var(--berry);animation:it-shk .45s}
@keyframes it-shk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.it-stamp{position:absolute;right:-4px;top:12px;background:#2c9b46;color:#fff;font:800 11px "Baloo 2",sans-serif;letter-spacing:.06em;padding:2px 12px 2px 10px;border-radius:99px 0 0 99px;animation:it-stamp .4s .15s cubic-bezier(.3,1.6,.5,1) both}

.it-mag{position:absolute;right:6px;bottom:2px;font-size:30px;animation:it-mag .7s .1s cubic-bezier(.3,1.5,.5,1) both;pointer-events:none}

.it-why .btn{align-self:flex-end}

    function can(wd,r,c,h){const dr=h?0:1,dc=h?1:0;if(at(r-dr,c-dc)||at(r+dr*wd.length,c+dc*wd.length))return false;if(r<0||c<0||r+dr*(wd.length-1)>=S||c+dc*(wd.length-1)>=S)return false;let cross=0;
      for(let k=0;k<wd.length;k++){const rr=r+dr*k,cc=c+dc*k,ch=gr[rr][cc];if(ch){if(ch!==wd[k])return false;cross++}else{if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return false}}return cross}
    function put(x,r,c,h){const dr=h?0:1,dc=h?1:0;for(let k=0;k<x.w.length;k++)gr[r+dr*k][c+dc*k]=x.w[k];placed.push({...x,r,c,h})}
    const first=pool.shift();put(first,15,15-Math.floor(first.w.length/2),true);
    for(const x of pool){if(placed.length>=count)break;const opts=[];
      placed.forEach(p=>{for(let i=0;i<p.w.length;i++)for(let j=0;j<x.w.length;j++)if(p.w[i]===x.w[j]){const h=!p.h;const r=p.h?p.r-j:p.r+i,c=p.h?p.c+i:p.c-j;const cr=can(x.w,r,c,h);if(cr)opts.push({r,c,h,cr})}});
      if(opts.length){const o=opts[Math.floor(Math.random()*opts.length)];put(x,o.r,o.c,o.h)}}
    if(placed.length<count)return null;
    let r0=S,c0=S,r1=0,c1=0;placed.forEach(p=>{r0=Math.min(r0,p.r);c0=Math.min(c0,p.c);r1=Math.max(r1,p.h?p.r:p.r+p.w.length-1);c1=Math.max(c1,p.h?p.c+p.w.length-1:p.c)});
    placed.forEach(p=>{p.r-=r0;p.c-=c0});return{placed,R:r1-r0+1,C:c1-c0+1};
  }
  const cells=(p)=>Array.from({length:p.w.length},(_,k)=>[p.r+(p.h?0:k),p.c+(p.h?k:0)]);
  const wordAt=(r,c,h)=>words.find(p=>p.h===h&&cells(p).some(([a,b])=>a===r&&b===c));
  const curWord=()=>sel?wordAt(sel[0],sel[1],dirH):null;
  function build(){
    let res=null;for(let i=0;i<80&&!res;i++)res=generate();if(!res){count=Math.max(4,count-1);return build()}
    words=res.placed;R=res.R;C=res.C;sol=Array.from({length:R},()=>Array(C).fill(''));ent=Array.from({length:R},()=>Array(C).fill(''));st=Array.from({length:R},()=>Array(C).fill(''));
    words.forEach(p=>{cells(p).forEach(([r,c],k)=>sol[r][c]=p.w[k])});
    const starts={};let num=0;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){const ws=words.filter(p=>p.r===r&&p.c===c);if(ws.length){num++;ws.forEach(p=>p.n=num);starts[r+','+c]=num}}
    const g=$('xg');g.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;g.style.width=`min(100%,${Math.round(C*Math.min(46,300/R))+(C-1)*3}px)`;g.innerHTML='';cellEl={};
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      if(sol[r][c]){const d=document.createElement('button');d.type='button';d.className='cr-c';d.setAttribute('aria-label',`Linha ${r+1}, coluna ${c+1}`);d.innerHTML=`${starts[r+','+c]?`<i>${starts[r+','+c]}</i>`:''}<b></b>`;
        d.onclick=()=>tap(r,c);cellEl[r+','+c]=d;g.appendChild(d)}
      else{const d=document.createElement('div');d.className='cr-e';g.appendChild(d)}}
    const li=p=>`<li value="${p.n}" data-n="${p.n}" data-h="${p.h?1:0}"><b>${p.n}.</b> ${p.d} <span class="cr-len">(${p.w.length})</span></li>`;
    $('xA').innerHTML=words.filter(p=>p.h).sort((a,b)=>a.n-b.n).map(li).join('');$('xD').innerHTML=words.filter(p=>!p.h).sort((a,b)=>a.n-b.n).map(li).join('');
    w.querySelectorAll('.cr-ol li').forEach(l=>l.onclick=()=>{const p=words.find(p=>p.n==l.dataset.n&&p.h===(l.dataset.h==='1'));if(p){SFX.click();dirH=p.h;sel=firstEmpty(p);paint();window.scrollTo({top:0,behavior:'smooth'})}});
    $('xfb').textContent='';hints=0;done=false;$('crPlay').hidden=false;$('crEnd').hidden=true;$('crEnd').innerHTML='';
    dirH=true;const f=words.slice().sort((a,b)=>a.n-b.n)[0];dirH=f.h;sel=[f.r,f.c];paint();
  }
  const firstEmpty=p=>cells(p).find(([r,c])=>!ent[r][c])||[p.r,p.c];
  function tap(r,c){
    SFX.click();
    if(sel&&sel[0]===r&&sel[1]===c){if(wordAt(r,c,!dirH))dirH=!dirH}
    else{sel=[r,c];if(!wordAt(r,c,dirH))dirH=!dirH}
    paint();
  }
  function type(l){
    if(done||!sel)return;const [r,c]=sel;
    ent[r][c]=l;st[r][c]='';SFX.tick();
    const el=cellEl[r+','+c];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    // avança para a próxima casa vazia da palavra
    const p=curWord();if(p){const cs=cells(p),i=cs.findIndex(([a,b])=>a===r&&b===c);
      const nx=cs.slice(i+1).find(([a,b])=>!ent[a][b])||cs.slice(0,i).find(([a,b])=>!ent[a][b])||cs[Math.min(i+1,cs.length-1)];sel=nx}
    afterChange();
  }
  function del(){
    if(done||!sel)return;const [r,c]=sel;SFX.click();
    if(ent[r][c]&&st[r][c]!=='rev'){ent[r][c]='';st[r][c]=''}
    else{const p=curWord();if(p){const cs=cells(p),i=cs.findIndex(([a,b])=>a===r&&b===c);if(i>0){sel=cs[i-1];const [a,b]=sel;if(st[a][b]!=='rev'){ent[a][b]='';st[a][b]=''}}}}
    afterChange(true);
  }
  function arrow(k){if(!sel)return;const d={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[k];
    let [r,c]=sel;for(let i=0;i<C+R;i++){r+=d[0];c+=d[1];if(r<0||c<0||r>=R||c>=C)return;if(sol[r][c]){sel=[r,c];if(!wordAt(r,c,dirH))dirH=!dirH;paint();return}}}
  function stepClue(dir){
    const ord=words.slice().sort((a,b)=>a.h===b.h?a.n-b.n:(a.h?-1:1));const p=curWord();let i=p?ord.indexOf(p):-1;i=(i+dir+ord.length)%ord.length;
    dirH=ord[i].h;sel=firstEmpty(ord[i]);SFX.click();paint();
  }
  $('crPrev').onclick=()=>stepClue(-1);$('crNext').onclick=()=>stepClue(1);
  function wordDone(p){return cells(p).every(([r,c])=>ent[r][c]===sol[r][c])}
  const doneSet=new Set();
  function afterChange(){
    // palavra completa e correta: onda verde
    words.forEach(p=>{const ok=wordDone(p),key=p.n+(p.h?'h':'v');
      if(ok&&!doneSet.has(key)){doneSet.add(key);cells(p).forEach(([r,c],k)=>{const el=cellEl[r+','+c];el.style.setProperty('--k',k);el.classList.remove('full');void el.offsetWidth;el.classList.add('full')});SFX.ok()}
      if(!ok)doneSet.delete(key)});
    paint();
    let total=0,right=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(sol[r][c]){total++;if(ent[r][c]===sol[r][c])right++}
    if(right===total)win();
  }
  function paint(){
    const p=curWord(),hlset=new Set(p?cells(p).map(([r,c])=>r+','+c):[]);
    let total=0,right=0;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(sol[r][c]){total++;if(ent[r][c]===sol[r][c])right++;
      const el=cellEl[r+','+c],k=r+','+c;el.classList.toggle('hl',hlset.has(k));el.classList.toggle('sel',!!sel&&sel[0]===r&&sel[1]===c&&!done);
      el.classList.toggle('good',st[r][c]==='good');el.classList.toggle('bad',st[r][c]==='bad');el.classList.toggle('rev',st[r][c]==='rev');
      const b=el.lastChild;if(b.textContent!==ent[r][c])b.textContent=ent[r][c]}
    $('crProg').style.width=(right/total*100)+'%';
    $('crClueT').innerHTML=p?`<small>${p.n} ${p.h?'➡️ HORIZONTAL':'⬇️ VERTICAL'} · ${p.w.length} letras</small>${p.d}`:'Toque num quadrinho';
    w.querySelectorAll('.cr-ol li').forEach(l=>{const q=words.find(q=>q.n==l.dataset.n&&q.h===(l.dataset.h==='1'));l.classList.toggle('on',q===p);l.classList.toggle('done',!!q&&wordDone(q))});
  }
  $('xCheck').onclick=()=>{if(done)return;let right=0,total=0,empty=0;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(sol[r][c]){total++;if(!ent[r][c]){empty++;continue}if(ent[r][c]===sol[r][c]){right++;if(st[r][c]!=='rev')st[r][c]='good'}else st[r][c]='bad'}
    paint();
    if(right===total){win();return}
    SFX.no();$('xfb').className='fb no cr-fb';$('xfb').textContent=`${right} de ${total} letras certas${empty?`, faltam ${empty}`:''}.`};
  $('xHint').onclick=()=>{if(done)return;const bad=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(sol[r][c]&&ent[r][c]!==sol[r][c])bad.push([r,c]);
    if(!bad.length)return;const cur=sel&&ent[sel[0]][sel[1]]!==sol[sel[0]][sel[1]]?sel:bad[Math.floor(Math.random()*bad.length)];
    const [r,c]=cur;ent[r][c]=sol[r][c];st[r][c]='rev';hints++;SFX.pop();sel=[r,c];const p=curWord();if(p){const n=cells(p).find(([a,b])=>!ent[a][b]);if(n)sel=n}
    const el=cellEl[r+','+c];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');afterChange()};
  $('xNew').onclick=()=>{SFX.click();doneSet.clear();build()};
  function win(){
    if(done)return;done=true;paint();SFX.win();addStars(20);confetti();
    $('xfb').textContent='';
    words.forEach(p=>cells(p).forEach(([r,c],k)=>{const el=cellEl[r+','+c];el.style.setProperty('--k',k+(p.h?0:2));el.classList.remove('full');void el.offsetWidth;el.classList.add('full')}));
    later(()=>{const e=$('crEnd');if(!e)return;$('crPlay').hidden=true;e.hidden=false;
      winPanel(e,{icon:'✏️',title:'Cruzadinha completa!',msg:hints?`Você usou ${hints} ${hints>1?'letras reveladas':'letra revelada'}. Dá para completar sem dicas!`:'Sem nenhuma dica. Incrível!',rate:hints===0?1:hints<=3?.7:.4,stars:20,again:()=>{doneSet.clear();build()}})},1100);
  }
  build();
}

/* ---------- 16. jogo da velha ---------- */
function tictac(){

  const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:12px';
  w.innerHTML=`<div class="seg" role="group" aria-label="Modo"><button type="button" data-m="facil" aria-pressed="false">🤖 Fácil</button><button type="button" data-m="dificil" aria-pressed="true">🤖 Difícil</button><button type="button" data-m="dois" aria-pressed="false">👥 2 jogadores</button></div>

  <div class="row"><button class="btn" id="tNew" type="button">Nova partida</button></div>`;
  app.append(w);fsTwo(w,$('txFrame'),1);w.style.setProperty('--fs-side','440px');
  let mode='dificil',p1=FR[0],p2=FR[2],b=Array(9).fill(null),turn=0,over=false,sc=[0,0],emp=0,starter=0,dead=false;
  const tms=new Set();
  const later=(f,ms)=>{const t=setTimeout(()=>{tms.delete(t);if(!dead)f()},ms);tms.add(t);return t};
  cleanup=()=>{dead=true;tms.forEach(clearTimeout);tms.clear()};
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=bd=>{for(const l of L)if(bd[l[0]]!==null&&bd[l[0]]===bd[l[1]]&&bd[l[1]]===bd[l[2]])return l;return null};
  const COL=['#e2384f','#3a6df0'];
  const mark=(who,cls)=>who===0
    ?`<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="${COL[0]}" stroke-width="14" stroke-linecap="round"><path pathLength="1" d="M27 27L73 73"/><path pathLength="1" d="M73 27L27 73"/></g></svg>`
    :`<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="${COL[1]}" stroke-width="14" stroke-linecap="round"><circle pathLength="1" cx="50" cy="50" r="25" transform="rotate(-90 50 50)"/></g></svg>`;
  const two=()=>mode==='dois';
  const name=k=>k===0?(two()?'Jogador 1':'Você'):(two()?'Jogador 2':'Computador');
  const board=$('tg'),cells=[];
  for(let i=0;i<9;i++){const c=document.createElement('button');c.type='button';c.className='tx-c';c.id='tc-'+i;c.onclick=()=>play(i);board.appendChild(c);cells.push(c)}
  function pickUI(){$('tPick').innerHTML=`<span class="note" style="align-self:center">Jogador 1:</span>`+FR.map((c,k)=>`<button type="button" class="mini" id="tp-${k}" aria-pressed="${c===p1}" aria-label="${c.n||''}">${c.e}</button>`).join('');
    FR.forEach((c,k)=>$('tp-'+k).onclick=()=>{if(c===p2)p2=p1;p1=c;SFX.click();pickUI();reset()})}
  function scores(){
    $('txA1').textContent=p1.e;$('txA2').textContent=p2.e;

    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,e=a.offsetWidth*.3;

          msg(`<span class="tx-row"><span class="tx-em">${mine?'🎉':'😅'}</span><span>${t}${mine?' +12 ⭐':''}</span></span><button class="btn" type="button" id="txAgain">Jogar de novo ▶</button>`,'end'+(mine?'':' lose'));

        },650);
      },380);

  function mm(bd,t){const l=win(bd);if(l)return bd[l[0]]===1?10:-10;if(bd.every(v=>v!==null))return 0;let best=t?-99:99;
    for(let i=0;i<9;i++)if(bd[i]===null){bd[i]=t;const s=mm(bd,1-t);bd[i]=null;best=t?Math.max(best,s):Math.min(best,s)}return best}
  function bot(){if(over)return;const free=b.map((v,i)=>v===null?i:-1).filter(i=>i>=0);let i;

/* ---------- arrastar e soltar ---------- */
function makeTilt(el,rx0,rz0,opts){
  opts=opts||{};let rx=rx0,rz=rz0,dragging=false,lastX=0,lastY=0,moved=0;
  function apply(){el.style.transform=`rotateX(${rx}deg) rotateZ(${rz}deg)`}
  apply();

function emojiMask(emoji,cols,rows){
  const res=72;
  const cv=document.createElement('canvas');cv.width=cv.height=res;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,res,res);
  ctx.font=Math.floor(res*0.82)+'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(emoji,res/2,res/2+res*0.05);
  let data;try{data=ctx.getImageData(0,0,res,res).data}catch(e){return null}
  const out=[];let any=0;
  for(let r=0;r<rows;r++){
    out.push([]);
    for(let c=0;c<cols;c++){
      const x0=Math.floor(c/cols*res),x1=Math.max(x0+1,Math.floor((c+1)/cols*res));
      const y0=Math.floor(r/rows*res),y1=Math.max(y0+1,Math.floor((r+1)/rows*res));
      let sum=0,count=0;
      for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){sum+=data[(y*res+x)*4+3];count++}
      const on=count?(sum/count)>70:false;
      out[r].push(on);if(on)any++;
    }
  }
  const frac=any/(cols*rows);
  return(frac>0.06&&frac<0.72)?out:null;
}

  const remaining=()=>[1,2,3,4].map(n=>cells.filter(x=>x.col===n&&!x.done).length);

  const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:12px';
  w.innerHTML=`<p class="sub">Resolva a conta: o resultado é a cor que você vai revelar! Vai virar uma surpresa do seu tema 👀</p>
    <div class="bar"><div class="stat">${T.icon} Surpresa</div><div class="stat">Revelado: <b id="pxP">0</b>%</div></div>
    <div class="pxwrap"><div class="pxgrid" id="pxGrid" style="grid-template-columns:repeat(${COLS},1fr)"></div></div>
    <div class="pxlegend" id="pxLeg"></div>
    <div class="box" id="pxQBox"></div>`;
  body.append(w);
  setClean(()=>clearTimeout(tm));
  function renderGrid(){
    let html='';
    const grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    cells.forEach(c=>grid[c.r][c.c]=c);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cell=grid[r][c];
      html+=cell?`<span class="pxcell${cell.done?' on':''}" style="${cell.done?`background:${PALETTE[cell.col-1]}`:''}"></span>`:`<span class="pxcell off"></span>`;
    }
    $('pxGrid').innerHTML=html;
    const pct=Math.round(solved/total*100);$('pxP').textContent=pct;
  }
  function renderLeg(){
    const rem=remaining();
    $('pxLeg').innerHTML=PALETTE.map((c,i)=>`<span class="pxlg${cur===i+1?' cur':''}"><i style="background:${c}"></i>${rem[i]} restante${rem[i]===1?'':'s'}</span>`).join('');
  }
  function mathFor(t){
    const r=Math.random();
    if(r<0.4){const b=ri(1,4+lvl*4);const a=b+t;return{q:`${a} − ${b} = ?`,a:t}}
    if(r<0.7){const b=Math.min(ri(0,3+lvl),t);const a=t-b;return{q:`${a} + ${b} = ?`,a:t}}
    if(t>1&&r<0.88){const d=ri(2,2+lvl);const a=t*d;return{q:`${a} ÷ ${d} = ?`,a:t}}
    for(const d of [2,3,4]){if(t%d===0){return{q:`${d} × ${t/d} = ?`,a:t}}}
    const b=ri(1,4+lvl*4);const a=b+t;return{q:`${a} − ${b} = ?`,a:t}
  }
  function nextQ(){
    const rem=remaining();
    const opts=[1,2,3,4].filter(n=>rem[n-1]>0);
    if(!opts.length){return finish()}
    cur=pick(opts,1)[0];renderLeg();
    const {q,a}=mathFor(cur);
    const choices=shuffle([1,2,3,4]);
    $('pxQBox').innerHTML=`<p class="q enter">${q}</p><div class="opts">${choices.map(n=>`<button class="opt" type="button" data-n="${n}">${n}</button>`).join('')}</div><p class="fb" id="pxFb" aria-live="polite"></p>`;
    let answered=false;
    $('pxQBox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;
      if(+b.dataset.n===a){answered=true;$('pxQBox').querySelectorAll('.opt').forEach(x=>x.disabled=true);
        SFX.ok();$('pxFb').className='fb ok';$('pxFb').textContent='Isso aí! Cor revelada ✨';
        const gained=cells.filter(x=>x.col===cur&&!x.done).length;
        cells.filter(x=>x.col===cur&&!x.done).forEach(x=>x.done=true);solved+=gained;lvl=Math.min(4,Math.floor(solved/6));
        renderGrid();tm=setTimeout(nextQ,650)}
      else{SFX.no();$('pxFb').className='fb no';shakeEl(b);$('pxFb').textContent='Ops, tenta de novo!'}
    });
  }
  function finish(){
    SFX.win();addStars(30);confetti();
    winPanel('pxQBox',{icon:'🎨',title:'Pixel art completo! 🎉',msg:`Olha só o que apareceu! ${T.cheer||''}`,stars:30,rate:1,again:()=>go(pixelMath)});
    $('pxLeg').innerHTML='';
  }
  renderGrid();renderLeg();nextQ();
}

function pegSolitaire(){
  panel('🔴 Resta 1');
  const valid=[];
  for(let r=0;r<7;r++)for(let c=0;c<7;c++){if((r<2||r>4)&&(c<2||c>4))continue;valid.push(r+','+c)}
  const isValid=(r,c)=>valid.includes(r+','+c);
  const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:12px';
  w.innerHTML=`<p class="sub">Toque num pino e depois num buraco que brilha: ele pula por cima de outro pino, que é comido. Objetivo: sobrar só 1 pino!</p>
  <div class="bar"><div class="stat">Pinos: <b id="pgN" class="rs-n">32</b></div><div class="stat">Recorde: <b id="pgRec">${bestGet('resta_capturas')?32-bestGet('resta_capturas'):'-'}</b></div></div>
  <p class="fb" id="pgFb" aria-live="polite"></p>
  <div class="rs-wrap" id="rsWrap"><div class="rs-board"><div class="rs-grid" id="pgGrid"><div class="rs-layer" id="rsLayer"></div></div></div></div>
  <div class="row rs-btns"><button class="btn" id="pgNew" type="button">Novo jogo</button><button class="btn ghost" id="rsUndo" type="button">↩ Desfazer</button><button class="btn ghost" id="rsHint" type="button">💡 Dica</button></div>`;
  app.append(w);
  let board,sel,cols,mm,hist=[],done=false,dead=false;
  const tms=new Set();
  const later=(f,ms)=>{const t=setTimeout(()=>{tms.delete(t);if(!dead)f()},ms);tms.add(t);return t};
  cleanup=()=>{dead=true;tms.forEach(clearTimeout);tms.clear()};
  const grid=$('pgGrid'),layer=$('rsLayer'),holes={};
  for(let r=0;r<7;r++)for(let c=0;c<7;c++){
    if(!isValid(r,c)){const s=document.createElement('span');s.className='rs-none';grid.insertBefore(s,layer);continue}
    const k=r+','+c,h=document.createElement('button');h.type='button';h.className='rs-hole';h.dataset.k=k;h.setAttribute('aria-label','Casa linha '+(r+1)+' coluna '+(c+1));
    h.onclick=()=>tap(k);grid.insertBefore(h,layer);holes[k]=h;
  }
  const rc=k=>k.split(',').map(Number);
  const place=(el,k)=>{const[r,c]=rc(k);el.style.transform=`translate(${c*100}%,${r*100}%)`};
  function count1(){return valid.reduce((n,k)=>n+(board[k]===1?1:0),0)}
  function legalMoves(){
    const ms=[],dirs=[[0,1],[0,-1],[1,0],[-1,0]];
    valid.forEach(k=>{
      if(board[k]!==1)return;
      const [r,c]=k.split(',').map(Number);
      dirs.forEach(([dr,dc])=>{
        const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc,mk=mr+','+mc,lk=lr+','+lc;
        if(isValid(mr,mc)&&isValid(lr,lc)&&board[mk]===1&&board[lk]===0)ms.push([k,mk,lk]);
      });
    });
    return ms;
  }
  function mkM(k,ci){
    const el=document.createElement('div');el.className='rs-m rs-c'+ci;el.innerHTML='<div class="rs-glass"></div>';
    el.style.transition='none';place(el,k);layer.appendChild(el);void el.offsetWidth;el.style.transition='';return el;
  }
  function sync(intro){
    layer.innerHTML='';mm={};let n=0;
    valid.forEach(k=>{if(board[k]===1){mm[k]=mkM(k,cols[k]);const g=mm[k].firstChild;
      if(intro&&g.animate)g.animate([{transform:'translateY(-160%) scale(.6)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:420,delay:n*18,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'});n++}});
  }
  function burst(k,ci){
    if(!layer.animate)return;const[r,c]=rc(k);
    const b=document.createElement('div');b.className='rs-burst';b.style.left=((c+.5)/7*100)+'%';b.style.top=((r+.5)/7*100)+'%';layer.appendChild(b);
    const cl=['#ffffff',['#e2384f','#3a6df0','#2ea84a','#8a4bd1','#ff8a1f','#17b0ba'][ci],'#ffd23f'];
    for(let n=0;n<11;n++){const i=document.createElement('i'),a=Math.random()*Math.PI*2,d=22+Math.random()*30;i.style.background=cl[n%3];b.appendChild(i);
      i.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-6}px)) scale(.15)`,opacity:0}],{duration:480+Math.random()*240,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'})}
    later(()=>b.remove(),850);
  }
  function refresh(){
    const tg=sel?legalMoves().filter(m=>m[0]===sel).map(m=>m[2]):[];
    Object.keys(holes).forEach(k=>holes[k].classList.toggle('t',tg.includes(k)));
    Object.keys(mm).forEach(k=>mm[k].classList.toggle('sel',k===sel));
    const n=count1(),e=$('pgN');if(e.textContent!==String(n)){e.textContent=n;e.classList.remove('tick');void e.offsetWidth;e.classList.add('tick')}
    $('rsUndo').disabled=!hist.length||done;$('rsHint').disabled=done;
  }
  function jump(from,mk,to){
    const el=mm[from],ci=cols[from],cap=mm[mk];
    hist.push({board:Object.assign({},board),cols:Object.assign({},cols)});
    board[from]=0;board[mk]=0;board[to]=1;
    cols[to]=ci;delete cols[from];const cci=cols[mk];delete cols[mk];
    mm[to]=el;delete mm[from];delete mm[mk];
    el.classList.add('mv');el.style.transitionDuration='.4s';place(el,to);
    const g=el.firstChild;if(g.animate)g.animate([{translate:'0 0',scale:'1'},{translate:'0 -34%',scale:'1.2',offset:.5},{translate:'0 0',scale:'1'}],{duration:400,easing:'ease-in-out'});
    tone(560,.1,'triangle',.18,0,720);
    if(cap){later(()=>{const cg=cap.firstChild;if(cg.animate)cg.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.35)',opacity:1,offset:.3},{transform:'scale(.1)',opacity:0}],{duration:400,easing:'ease-in',fill:'forwards'});
      burst(mk,cci);tone(280,.12,'sawtooth',.08,0,120);tone(880,.08,'triangle',.12,.02,1300);later(()=>cap.remove(),430)},190)}
    later(()=>{el.classList.remove('mv');tone(190,.05,'square',.07)},420);
  }
  function tap(k){
    if(done)return;
    const v=board[k];
    if(v===1){sel=(sel===k)?null:k;SFX.click();refresh();return}
    if(v===0&&sel){
      const [r1,c1]=sel.split(',').map(Number),[r2,c2]=k.split(',').map(Number);
      const dr=r2-r1,dc=c2-c1;
      if(Math.abs(dr)+Math.abs(dc)===2&&(dr===0||dc===0)){
        const mk=(r1+dr/2)+','+(c1+dc/2);
        if(board[mk]===1){const from=sel;sel=null;jump(from,mk,k);refresh();status();return}
      }
      sel=null;SFX.no();refresh();return;
    }
    sel=null;refresh();
  }
  function status(){
    const n=count1(),ms=legalMoves();
    if(n===1||!ms.length){finish(n);return}
    $('pgFb').className='fb';$('pgFb').textContent='';
  }
  function finish(n){
    done=true;sel=null;refresh();
    const captured=32-n,prev=bestGet('resta_capturas');
    const rec=bestSet('resta_capturas',captured);$('pgRec').textContent=32-rec;
    const isRec=captured>prev&&prev>0,center=board['3,3']===1&&n===1;
    const stars=n===1?30:n<=6?10:0;
    const rate=n===1?1:n===2?.8:n===3?.65:n===4?.6:n===5?.4:n<=8?.25:.1;
    const title=n===1?(center?'Gênio perfeito!':'Gênio! Só sobrou 1!'):n===2?'Quase gênio!':n===3?'Muito bem!':n<=5?'Bom jogo!':'Fim de jogo';
    const msg=n===1?(center?'Sobrou 1 pino, bem no centro! Isso é nota máxima.':'Sobrou só 1 pino! Agora tenta terminar no centro.'):n===2?'Faltou só um pulinho para ser perfeito.':`Sobraram ${n} pinos. Dá para fazer melhor — tenta de novo!`;
    $('pgFb').className='fb '+(n===1?'ok':'');$('pgFb').textContent=n===1?'Incrível! Só sobrou 1 pino! 🎉':`Fim de jogo — sobraram ${n} pinos.`;
    addStars(stars);
    later(()=>{
      if(n===1){SFX.win();confetti()}else{SFX.no();if(n<=3)confetti()}
      const ov=document.createElement('div');ov.className='overlay gxOv c3d-end';$('rsWrap').append(ov);
      winPanel(ov,{icon:n===1?'🏆':n<=3?'🥈':n<=5?'🥉':'💪',title,msg,stars,rate,record:isRec,again:start});
      const bt=ov.querySelector('.winFull__btns');
      if(bt){const v=document.createElement('button');v.type='button';v.className='btn ghost';v.textContent='👀 Ver o tabuleiro';v.onclick=()=>{SFX.click();ov.remove()};bt.prepend(v)}
    },n===1?900:700);
  }
  function start(){
    tms.forEach(clearTimeout);tms.clear();const o=$('rsWrap').querySelector('.overlay');if(o)o.remove();
    board={};cols={};valid.forEach((k,i)=>{board[k]=1;const[r,c]=rc(k);cols[k]=(r*2+c*3)%6});board['3,3']=0;delete cols['3,3'];
    sel=null;hist=[];done=false;sync(true);refresh();$('pgFb').className='fb';$('pgFb').textContent='';
  }
  $('pgNew').onclick=()=>{SFX.click();start()};
  $('rsUndo').onclick=()=>{
    if(!hist.length||done)return;SFX.click();
    tms.forEach(clearTimeout);tms.clear();
    const h=hist.pop();board=h.board;cols=h.cols;sel=null;sync(false);refresh();
  };
  $('rsHint').onclick=()=>{
    if(done)return;const ms=legalMoves();if(!ms.length)return;SFX.click();
    const m=ms[Math.floor(Math.random()*ms.length)];sel=m[0];refresh();
    const e=mm[m[0]];if(e){e.classList.add('hint');later(()=>e.classList.remove('hint'),1800)}
  };
  start();
}

function noiseBuffer(){
  const a=ac();if(!a)return null;
  if(!window.__jpNoise){const len=a.sampleRate*.5,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;window.__jpNoise=buf}
  return window.__jpNoise;
}
function musicTone(freq,dur,type,vol,when,cutoff){
  const a=ac();if(!a||muted)return;const t=a.currentTime+when;
  const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  let node=o;
  if(cutoff){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=cutoff;o.connect(f);node=f}
  node.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function musicKick(when,vol){
  const a=ac();if(!a||muted)return;const t=a.currentTime+when;
  const o=a.createOscillator(),g=a.createGain();o.type='sine';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.14);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.2);
}
function musicHat(when,vol){
  const a=ac();if(!a||muted)return;const buf=noiseBuffer();if(!buf)return;const t=a.currentTime+when;
  const src=a.createBufferSource();src.buffer=buf;
  const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.045);
  src.connect(hp).connect(g).connect(a.destination);src.start(t);src.stop(t+.05);
}
function musicSnare(when,vol){
  const a=ac();if(!a||muted)return;const buf=noiseBuffer();if(!buf)return;const t=a.currentTime+when;
  const src=a.createBufferSource();src.buffer=buf;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.8;
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);
  src.connect(bp).connect(g).connect(a.destination);src.start(t);src.stop(t+.1);
}

const CHESS_PVAL={P:100,N:320,B:330,R:500,Q:900,K:0};
const CHESS_GLYPH={wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
const chessOpp=c=>c==='w'?'b':'w';
const chessColor=p=>p?p[0]:null;
const chessType=p=>p?p[1]:null;
const chessInb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function chessInitBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  const back=['R','N','B','Q','K','B','N','R'];
  for(let c=0;c<8;c++){b[0][c]='b'+back[c];b[1][c]='bP';b[6][c]='wP';b[7][c]='w'+back[c]}
  return b;
}
function chessCloneState(st){return{board:st.board.map(row=>row.slice()),turn:st.turn,castle:{...st.castle},ep:st.ep?[...st.ep]:null,halfmove:st.halfmove}}
function chessNewState(){return{board:chessInitBoard(),turn:'w',castle:{wK:true,wQ:true,bK:true,bQ:true},ep:null,halfmove:0}}
function chessIsAttacked(st,r,c,byColor){
  const b=st.board;
  const pd=byColor==='w'?1:-1;
  for(const dc of[-1,1]){const pr=r+pd,pc=c+dc;if(chessInb(pr,pc)&&b[pr][pc]===byColor+'P')return true}
  const kn=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
  for(const[dr,dc]of kn){const tr=r+dr,tc=c+dc;if(chessInb(tr,tc)&&b[tr][tc]===byColor+'N')return true}
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const tr=r+dr,tc=c+dc;if(chessInb(tr,tc)&&b[tr][tc]===byColor+'K')return true}
  for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){let tr=r+dr,tc=c+dc;while(chessInb(tr,tc)){const p=b[tr][tc];if(p){if(chessColor(p)===byColor&&(chessType(p)==='R'||chessType(p)==='Q'))return true;break}tr+=dr;tc+=dc}}
  for(const[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){let tr=r+dr,tc=c+dc;while(chessInb(tr,tc)){const p=b[tr][tc];if(p){if(chessColor(p)===byColor&&(chessType(p)==='B'||chessType(p)==='Q'))return true;break}tr+=dr;tc+=dc}}

const damaOpp=c=>c==='w'?'b':'w';

function damaDirs(p){

  const caps=[],simples=[];

function damaAiMove(st){

  if(!moves.length)return null;

    moves.forEach(m=>{const v=damaMinimax(damaApplyMove(st,m),3,-Infinity,Infinity)+Math.random()*.05;

      const ns=damaApplyMove(st,m);

function svReminder(){
  const c=svCfg();if(!PROFILE||STARS<30)return null;
  if(svEnabled()&&c.auto!==false&&c.lastPush&&Date.now()-c.lastPush<3*864e5)return null;
  if(c.snooze&&Date.now()<c.snooze)return null;
  const last=c.lastBackup||0;
  if(!last)return {msg:`Você já juntou ⭐ ${STARS}! Guarde uma cópia para não perder se trocar de celular.`};
  const days=Math.floor((Date.now()-last)/864e5),plus=STARS-(c.lastBackupStars||0);
  if(plus>=40||days>=10)return {msg:plus>=40?`Você ganhou +${plus} ⭐ desde o último backup. Que tal salvar de novo?`:`Faz ${days} dias que você não salva seu progresso.`};
  return null;
}

}

function svConfirmRestore(P,src){
  return new Promise(res=>{
    const cur=svCollect({mundo:false}),m=svModal(`<h3>Restaurar progresso?</h3>
      <p>Encontrei ${src}:<br>${svSummary(P)}</p>

      <button class="btn" type="button" data-r="merge">🔀 Juntar (recomendado)<small>Fica com o maior de cada recorde e com o visual mais novo. Nada se perde.</small></button>
      <button class="btn alt" type="button" data-r="replace">♻️ Substituir tudo<small>Troca tudo pelo que foi encontrado. Suas ⭐ podem diminuir.</small></button>
      <button class="btn ghost" type="button" data-r="">Cancelar</button>`);
    m.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b&&e.target!==m)return;const v=b?b.dataset.r:'';m.close();res(v||null)});
  });

function svAfterRestore(done,mode){
  SFX.win();confetti();
  const bad=done.filter(x=>x[0]==='!').map(x=>x.slice(1));
  toast(`Progresso ${mode==='replace'?'restaurado':'juntado'}! ⭐ ${STARS}${bad.length?' (não coube: '+bad.join(', ')+')':''}`,'💾');
  SV_PENDING=null;const c=svCfg();c.lastBackup=Date.now();c.lastBackupStars=STARS;svCfgSave();
  go(menu);
}
async function svRestorePayload(P,src){
  const mode=await svConfirmRestore(P,src);if(!mode)return false;
  const done=svApply(P,mode);svAfterRestore(done,mode);return true;
}
async function svCopyText(t){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-999px;top:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');ta.remove();return !!ok}catch(e){return false}
}
function svFileName(){const n=(svClean(PROFILE&&PROFILE.name,18)||'jogador').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()||'jogador';return `progresso-${n}-${new Date().toISOString().slice(0,10)}.json`}
async function svReadFile(f){
  if(!f)return null;if(f.size>25e6)throw new SvErr('Esse arquivo é grande demais para ser um progresso do jogo.');
  const txt=await (f.text?f.text():new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f)}));
  let J;try{J=JSON.parse(txt)}catch(e){
    if(/JP1\./.test(txt))return svDecode(txt);
    throw new SvErr('Não consegui ler esse arquivo. Ele precisa ser um arquivo de progresso deste jogo (.json).')}
  if(!J||J.format!=='jp-backup'||!J.payload)throw new SvErr('Esse arquivo não é um backup deste jogo.');
  if((J.v|0)>1)throw new SvErr('Esse arquivo é de uma versão mais nova do jogo. Atualize o jogo e tente de novo.');
  const bytes=new TextEncoder().encode(JSON.stringify(J.payload));
  if(J.crc&&svCrc(bytes).toString(16).padStart(8,'0')!==J.crc)throw new SvErr('O arquivo foi alterado ou está danificado (a conferência não bateu).');
  return svSanitize(J.payload);
}

    pwaModal(`<p>Para instalar como um app:</p><ol>
